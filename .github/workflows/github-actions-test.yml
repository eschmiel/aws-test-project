name: Github Actions Test
run-name: Trying out Github Actions
on:
  push:
    branches:
      - main
jobs:
  Testo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: 
          node-version: 22.19.0
      - working-directory: ./FE
      - run: npm run build